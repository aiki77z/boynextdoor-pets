<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BOYNEXTDOOR Pets</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="pet-stage" aria-label="Pet stage">
        <div class="pet-room" id="petRoom">
          <div class="bubble" id="bubbleText">Hello</div>
          <div class="pet-cluster" id="petCluster">
            <button class="pet-button" id="petButton" type="button" aria-label="Interact with pet">
              <span class="pet" id="petSprite" aria-hidden="true">
                <canvas class="pet-canvas" id="petCanvas" width="384" height="416"></canvas>
              </span>
            </button>
            <div class="pet-nameplate" id="petTitle">Catbbi</div>
          </div>
        </div>

        <div class="action-bar" aria-label="Pet actions">
          <button class="shell-button" id="idleButton" type="button" title="Idle" aria-label="Idle">😊</button>
          <button class="shell-button" id="talkButton" type="button" title="Next Bubble" aria-label="Next Bubble">💬</button>
          <button class="shell-button" id="nextPetButton" type="button" title="Next Pet" aria-label="Next Pet">🐾</button>
          <button class="shell-button" id="scaleButton" type="button" title="Scale Pet" aria-label="Scale Pet">🔍</button>
          <button class="shell-button" id="editBubbleButton" type="button" title="Edit Bubble Text" aria-label="Edit Bubble Text">✏️</button>
          <button class="shell-button" id="aiSettingsButton" type="button" title="AI Settings" aria-label="AI Settings">AI</button>
          <button class="shell-button" id="aiChatButton" type="button" title="AI Chat" aria-label="AI Chat" disabled>☁</button>
          <button class="shell-button" id="bubbleToggleButton" type="button" title="Toggle Bubbles" aria-label="Toggle Bubbles">🗨️</button>
          <button class="shell-button" id="companionButton" type="button" title="Companion Mode" aria-label="Companion Mode">♡</button>
          <button class="shell-button" id="pinButton" type="button" title="Always On Top" aria-label="Always On Top">📌</button>
          <button class="shell-button" id="hideButton" type="button" title="Hide To Tray" aria-label="Hide To Tray">🙈</button>
          <button class="shell-button shell-button-danger" id="quitButton" type="button" title="Quit" aria-label="Quit">✕</button>
          <button class="action-button" data-action="running-right" type="button">Right</button>
          <button class="action-button" data-action="running-left" type="button">Left</button>
          <button class="action-button" data-action="waving" type="button">Wave</button>
          <button class="action-button" data-action="jumping" type="button">Jump</button>
          <button class="action-button" data-action="failed" type="button">Fail</button>
          <button class="action-button" data-action="waiting" type="button">Wait</button>
          <button class="action-button" data-action="running" type="button">Busy</button>
          <button class="action-button" data-action="review" type="button">Review</button>
        </div>
      </section>
    </main>

    <div class="bubble-editor-modal" id="bubbleEditorModal" aria-hidden="true">
      <div class="bubble-editor-backdrop" id="bubbleEditorBackdrop"></div>
      <section class="bubble-editor-dialog" aria-label="Edit Bubble Text">
        <div class="bubble-editor-header">
          <h2>Bubble Text</h2>
        </div>
        <div class="bubble-manager">
          <div class="bubble-line-list" id="bubbleLineList" role="listbox" tabindex="0" aria-label="Bubble text lines"></div>
          <div class="bubble-line-actions">
            <button class="editor-button" id="addBubbleLineButton" type="button">New</button>
            <button class="editor-button" id="editBubbleLineButton" type="button">Edit</button>
            <button class="editor-button" id="deleteBubbleLineButton" type="button">Delete</button>
          </div>
        </div>
        <div class="bubble-line-form" id="bubbleLineForm" hidden>
          <label for="bubbleLineInput">Line text</label>
          <input id="bubbleLineInput" type="text" maxlength="80" placeholder="输入一句台词">
          <div class="bubble-line-form-actions">
            <button class="editor-button" id="confirmBubbleLineButton" type="button">OK</button>
            <button class="editor-button" id="cancelBubbleLineButton" type="button">Cancel</button>
          </div>
        </div>
        <div class="bubble-editor-actions bubble-editor-footer">
          <button class="editor-button" id="saveBubbleButton" type="button">Save</button>
          <button class="editor-button" id="resetBubbleButton" type="button">Restore Default</button>
          <button class="editor-button" id="cancelBubbleEditorButton" type="button">Cancel</button>
        </div>
      </section>
    </div>

    <div class="chat-panel-modal" id="chatPanelModal" aria-hidden="true">
      <div class="chat-panel-backdrop" id="chatPanelBackdrop"></div>
      <section class="chat-panel-dialog" aria-label="AI Settings">
        <div class="chat-panel-header">
          <div>
            <h2>AI Settings</h2>
            <p id="chatPanelSubtitle">DeepSeek model settings</p>
          </div>
          <button class="editor-button" id="closeChatPanelButton" type="button">Close</button>
        </div>

        <div class="chat-settings-grid">
          <label class="chat-field">
            <span>Enable AI</span>
            <input id="chatEnabledInput" type="checkbox">
          </label>
          <label class="chat-field">
            <span>Model</span>
            <input id="chatModelInput" type="text" maxlength="60" placeholder="deepseek-chat">
          </label>
          <label class="chat-field chat-field-wide">
            <span>Base URL</span>
            <input id="chatBaseUrlInput" type="url" maxlength="120" placeholder="https://api.deepseek.com">
          </label>
          <label class="chat-field chat-field-wide">
            <span>API Key</span>
            <input id="chatApiKeyInput" type="password" maxlength="160" placeholder="Enable AI 时填写，留空则保留当前 Key">
          </label>
        </div>

        <div class="chat-settings-actions">
          <button class="editor-button" id="saveChatSettingsButton" type="button">Save Settings</button>
          <span class="chat-settings-hint" id="chatSettingsHint"></span>
        </div>
      </section>
    </div>

    <div class="chat-window-modal" id="chatWindowModal" aria-hidden="true">
      <div class="chat-window-backdrop" id="chatWindowBackdrop"></div>
      <section class="chat-window-dialog" aria-label="Pet Chat">
        <div class="chat-window-header">
          <div>
            <h2 id="chatWindowTitle">Pet Chat</h2>
            <p id="chatWindowSubtitle">recent memory 0</p>
          </div>
          <div class="chat-window-actions">
            <button class="editor-button" id="clearChatMemoryButton" type="button">Clear</button>
            <button class="editor-button" id="closeChatWindowButton" type="button">Close</button>
          </div>
        </div>
        <div class="chat-history" id="chatHistory" aria-live="polite"></div>
        <form class="chat-compose" id="chatComposeForm">
          <label class="chat-field chat-field-wide" for="chatInput">
            <span>Message</span>
            <textarea id="chatInput" maxlength="100" rows="3" placeholder="输入不超过 100 字"></textarea>
          </label>
          <div class="chat-compose-footer">
            <span class="chat-counter" id="chatCounter">0 / 100</span>
            <button class="editor-button" id="sendChatButton" type="submit">Send</button>
          </div>
        </form>
      </section>
    </div>

    <script src="./pet-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
