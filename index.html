<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BOYNEXTDOOR Pets</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="pet-stage" aria-label="Pet stage">
        <header class="floating-toolbar">
          <div class="status-pill" id="moodLabel">idle</div>
        </header>

        <div class="pet-room" id="petRoom">
          <div class="bubble" id="bubbleText">Hello</div>
          <button class="side-action side-action-left" id="scaleButton" type="button" title="Scale Pet" aria-label="Scale Pet">🔍</button>
          <button class="side-action" id="editBubbleButton" type="button" title="Edit Bubble Text" aria-label="Edit Bubble Text">✏️</button>
          <button class="pet-button" id="petButton" type="button" aria-label="Interact with pet">
            <span class="pet" id="petSprite" aria-hidden="true">
              <canvas class="pet-canvas" id="petCanvas" width="384" height="416"></canvas>
            </span>
          </button>
          <div class="pet-nameplate" id="petTitle">Catbbi</div>
        </div>

        <div class="action-bar" aria-label="Pet actions">
          <button class="shell-button" id="idleButton" type="button" title="Idle" aria-label="Idle">😊</button>
          <button class="shell-button" id="talkButton" type="button" title="Next Bubble" aria-label="Next Bubble">💬</button>
          <button class="shell-button" id="nextPetButton" type="button" title="Next Pet" aria-label="Next Pet">🐾</button>
          <button class="shell-button" id="bubbleToggleButton" type="button" title="Toggle Bubbles" aria-label="Toggle Bubbles">🗨️</button>
          <button class="shell-button" id="pinButton" type="button" title="Always On Top" aria-label="Always On Top">📌</button>
          <button class="shell-button" id="detailsButton" type="button" title="Toggle Details" aria-label="Toggle Details">☰</button>
          <button class="shell-button" id="hideButton" type="button" title="Hide To Tray" aria-label="Hide To Tray">🙈</button>
          <button class="shell-button shell-button-danger" id="quitButton" type="button" title="Quit" aria-label="Quit">✕</button>
          <button class="action-button" data-action="running-right" type="button">Right</button>
          <button class="action-button" data-action="running-left" type="button">Left</button>
          <button class="action-button" data-action="waving" type="button">Wave</button>
          <button class="action-button" data-action="jumping" type="button">Jump</button>
          <button class="action-button" data-action="failed" type="button">Fail</button>
          <button class="action-button" data-action="waiting" type="button">Wait</button>
          <button class="action-button" data-action="running" type="button">Busy</button>
          <button class="action-button" data-action="review" type="button">Review</button>
        </div>
      </section>

      <aside class="pet-panel" aria-label="Pet details">
        <div class="panel-section">
          <h2>Pets</h2>
          <div class="pet-list" id="petList"></div>
        </div>

        <div class="panel-section">
          <h2>Profile</h2>
          <dl class="profile-list" id="profileList"></dl>
        </div>

        <div class="panel-section">
          <h2>Animation Notes</h2>
          <ul class="animation-list" id="animationList"></ul>
        </div>
      </aside>
    </main>

    <div class="bubble-editor-modal" id="bubbleEditorModal" aria-hidden="true">
      <div class="bubble-editor-backdrop" id="bubbleEditorBackdrop"></div>
      <section class="bubble-editor-dialog" aria-label="Edit Bubble Text">
        <div class="bubble-editor-header">
          <h2>Bubble Text</h2>
        </div>
        <textarea class="bubble-editor" id="bubbleEditor" rows="7" placeholder="一行一句"></textarea>
        <div class="bubble-editor-actions">
          <button class="editor-button" id="saveBubbleButton" type="button">Save</button>
          <button class="editor-button" id="resetBubbleButton" type="button">Reset</button>
        </div>
      </section>
    </div>

    <script src="./pet-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
